<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IncubadoraPRO</title>
    <meta name="description" content="Sistema profissional para controle de incubadoras">
    <meta name="theme-color" content="#1565C0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IncubadoraPRO">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="png192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="png512.png">
    <link rel="apple-touch-icon" href="png192.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Estilos do ChatGrod e Modal API (isolados, não tocam no existente) -->
    <style>
        /* ===== Botão Chat Flutuante ===== */
        .chat-fab {
            position: fixed;
            bottom: 100px;
            right: 18px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1565C0, #0D47A1);
            color: #fff;
            border: none;
            box-shadow: 0 4px 18px rgba(21,101,192,0.45);
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: transform .2s, box-shadow .2s;
        }
        .chat-fab:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(21,101,192,0.6); }
        .chat-fab .badge-dot {
            position: absolute;
            top: 2px; right: 2px;
            width: 12px; height: 12px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid #fff;
            display: none;
        }

        /* ===== Janela do Chat ===== */
        .chat-window {
            position: fixed;
            bottom: 166px;
            right: 18px;
            width: 340px;
            max-width: calc(100vw - 36px);
            height: 460px;
            max-height: calc(100vh - 220px);
            background: #1a1a2e;
            border-radius: 18px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.5);
            z-index: 10000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            animation: chatSlideUp .25s ease;
        }
        @keyframes chatSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .chat-window.open { display: flex; }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: linear-gradient(135deg, #1565C0, #0D47A1);
            color: #fff;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header-left i { font-size: 1.2rem; }
        .chat-header-left span { font-weight: 700; font-size: 0.95rem; }
        .chat-close-btn {
            background: none; border: none; color: #fff; font-size: 1.3rem;
            cursor: pointer; opacity: .8; transition: opacity .2s;
        }
        .chat-close-btn:hover { opacity: 1; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .chat-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: msgFade .2s ease;
        }
        @keyframes msgFade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .chat-msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1565C0, #1976D2);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.assistant {
            align-self: flex-start;
            background: #2a2a4a;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .chat-msg.system {
            align-self: center;
            background: transparent;
            color: #888;
            font-size: 0.78rem;
            text-align: center;
            padding: 4px 0;
        }

        .chat-typing {
            align-self: flex-start;
            display: flex;
            gap: 5px;
            padding: 12px 18px;
            background: #2a2a4a;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }
        .chat-typing span {
            width: 7px; height: 7px;
            background: #888;
            border-radius: 50%;
            animation: typingBounce .6s infinite alternate;
        }
        .chat-typing span:nth-child(2) { animation-delay: .15s; }
        .chat-typing span:nth-child(3) { animation-delay: .3s; }
        @keyframes typingBounce {
            to { transform: translateY(-6px); opacity: .4; }
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: #16162a;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .chat-input-area input {
            flex: 1;
            background: #2a2a4a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
            transition: border-color .2s;
        }
        .chat-input-area input::placeholder { color: #666; }
        .chat-input-area input:focus { border-color: #1565C0; }
        .chat-send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1565C0, #0D47A1);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: transform .15s, opacity .15s;
        }
        .chat-send-btn:hover { transform: scale(1.08); }
        .chat-send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

        /* ===== Modal API Key ===== */
        .api-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 20000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn .2s ease;
        }
        .api-modal-overlay.open { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .api-modal-box {
            background: #fff;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            padding: 28px 24px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: modalPop .25s ease;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }
        .api-modal-box h3 {
            margin: 0 0 6px;
            font-size: 1.15rem;
            color: #1a1a2e;
        }
        .api-modal-box p {
            margin: 0 0 18px;
            font-size: 0.82rem;
            color: #888;
            line-height: 1.5;
        }
        .api-modal-box input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color .2s;
            box-sizing: border-box;
        }
        .api-modal-box input:focus { border-color: #1565C0; }
        .api-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: flex-end;
        }
        .api-modal-actions button {
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform .12s, box-shadow .12s;
        }
        .api-modal-actions button:active { transform: scale(0.96); }
        .api-modal-actions .api-cancel-btn {
            background: #f0f0f0;
            color: #555;
        }
        .api-modal-actions .api-save-btn {
            background: linear-gradient(135deg, #1565C0, #0D47A1);
            color: #fff;
            box-shadow: 0 3px 12px rgba(21,101,192,0.35);
        }

        /* Botão "Chat IA" nas configurações - aparece só se não tiver chave */
        .chat-api-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #1565C0, #1976D2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
        }
        .chat-api-trigger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(21,101,192,0.4);
        }
        .chat-api-trigger:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <i class="fas fa-egg"></i>
                <h1>Incubadora<span>PRO</span></h1>
            </div>
            <div>
                <button id="install-btn" class="install-btn" style="display: none;">
                    <i class="fas fa-download"></i> Instalar
                </button>
            </div>
        </header>

        <div class="status">
            <span class="status-dot"></span>
            <span id="connection-status">Online</span>
        </div>

        <nav class="nav">
            <button class="nav-btn active" data-page="dashboard">
                <i class="fas fa-tachometer-alt"></i>
                <span>Painel</span>
            </button>
            <button class="nav-btn" data-page="batches">
                <i class="fas fa-egg"></i>
                <span>Lotes</span>
            </button>
            <button class="nav-btn" data-page="settings">
                <i class="fas fa-cog"></i>
                <span>Config</span>
            </button>
        </nav>

        <div class="content">
            <!-- Página: Painel -->
            <div id="dashboard" class="page active">
                <div class="time" id="current-time">--:--:--</div>
                
                <div class="card">
                    <div class="card-header">
                        <span>Temperatura</span>
                        <i class="fas fa-temperature-high"></i>
                    </div>
                    <div class="temp-display">
                        <div class="temp-value">
                            <span id="temp-value">37.5</span>
                            <span class="temp-unit">°C</span>
                        </div>
                        <div class="temp-bar">
                            <div class="temp-fill" id="temp-fill"></div>
                        </div>
                        <small>Ideal: <span id="ideal-temp">37.5</span>°C</small>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span>Umidade</span>
                        <i class="fas fa-tint"></i>
                    </div>
                    <div class="temp-display">
                        <div class="temp-value">
                            <span id="humidity-value">55</span>
                            <span class="temp-unit">%</span>
                        </div>
                        <div class="temp-bar">
                            <div class="temp-fill" id="humidity-fill"></div>
                        </div>
                        <small>Ideal: 55%</small>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span>Viragem</span>
                        <i class="fas fa-sync-alt"></i>
                    </div>
                    <div class="heartbeat">
                        <i class="fas fa-heart heart-icon"></i>
                        <span id="turn-status">Aguardando</span>
                    </div>
                    <div style="text-align: center; color: #666; font-size: 0.9rem;">
                        Próxima: <span id="next-turn">--:--</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span>Status do Sistema</span>
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <div class="status-grid">
                        <div class="status-item">
                            <i class="fas fa-wifi"></i>
                            <span>Conexão: <strong>OK</strong></span>
                        </div>
                        <div class="status-item">
                            <i class="fas fa-battery-three-quarters"></i>
                            <span>Energia: <strong>Estável</strong></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Página: Lotes -->
            <div id="batches" class="page">
                <button class="btn" onclick="openBatchModal()">
                    <i class="fas fa-plus"></i> Novo Lote
                </button>
                
                <div id="batches-container">
                    <div class="empty-state">
                        <i class="fas fa-egg"></i>
                        <p>Nenhum lote cadastrado</p>
                    </div>
                </div>
            </div>
            
            <!-- Página: Configurações -->
            <div id="settings" class="page">
                <div class="card">
                    <div class="card-header">
                        <span>Notificações</span>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="temp-alerts" checked> Alertas de temperatura
                        </label>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="turn-reminders" checked> Lembretes de viragem
                        </label>
                    </div>
                </div>

                <!-- NOVO: Card do Chat IA nas Configurações -->
                <div class="card" id="chat-settings-card">
                    <div class="card-header">
                        <span>Assistente IA</span>
                        <i class="fas fa-robot"></i>
                    </div>
                    <div id="chat-api-section">
                        <!-- Conteúdo dinâmico: botão "Configurar API" ou status "Ativo" -->
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span>Dados</span>
                    </div>
                    <button class="btn btn-danger" onclick="clearData()">
                        <i class="fas fa-trash"></i> Limpar todos os dados
                    </button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Desenvolvido por Elias Costa Negret's</p>
            <div class="social-links">
                <a href="https://instagram.com" target="_blank" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://youtube.com" target="_blank" title="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://telegram.org" target="_blank" title="Telegram">
                    <i class="fab fa-telegram"></i>
                </a>
            </div>
        </div>
    </div>
    
    <!-- Modal: Novo/Editar Lote -->
    <div id="batch-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Novo Lote</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="batch-form" onsubmit="saveBatch(event)">
                <input type="hidden" id="batch-id">
                <div class="form-group">
                    <label>Tipo de Ave</label>
                    <select id="bird-type" required>
                        <option value="">Selecione...</option>
                        <option value="chicken">🐔 Galinha</option>
                        <option value="duck">🦆 Pato</option>
                        <option value="quail">🐦 Codorna</option>
                        <option value="goose">🪿 Ganso</option>
                        <option value="swan">🦢 Cisne</option>
                        <option value="peacock">🦚 Pavão</option>
                        <option value="pheasant">🐓 Faisão</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data de Início</label>
                    <input type="date" id="start-date" required>
                </div>
                <div class="form-group">
                    <label>Quantidade de Ovos</label>
                    <input type="number" id="egg-count" min="1" required>
                </div>
                <div class="form-group">
                    <label>Observações</label>
                    <textarea id="notes" rows="2"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal: Detalhes do Lote -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalhes do Lote</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="batch-details-content">
                <!-- Conteúdo dinâmico -->
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- NOVO: Botão flutuante do Chat -->
    <bu
